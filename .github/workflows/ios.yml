name: iOS build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    strategy:
      fail-fast: false
      matrix:
        package: [PlayitCore, PlayitTransferCore]
    steps:
      - uses: actions/checkout@v4
      - name: Test Foundation package
        run: swift test --package-path "Packages/${{ matrix.package }}"

  ios:
    runs-on: macos-15
    needs: core-tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project from current sources
        run: python3 scripts/generate-project.py
      - uses: actions/cache@v4
        with:
          path: /tmp/playit-spm
          key: mpvkit-98c3453e252922e3136422da3fbb2e341ed9edc8-${{ runner.arch }}
      - name: Resolve pinned packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project Prism.xcodeproj -scheme Prism
          -clonedSourcePackagesDirPath /tmp/playit-spm
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          xcrun simctl list devices available --json > /tmp/playit-devices.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/playit-devices.json'))
          devices = [device for runtime, group in data['devices'].items()
                     if '.iOS-' in runtime for device in group
                     if device.get('isAvailable') and 'iPhone' in device['name']]
          if not devices:
              raise SystemExit('No available iPhone simulator is installed.')
          selected = devices[0]
          print('Selected:', selected['name'], selected['udid'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('id=' + selected['udid'] + '\n')
          PY
      - name: Build application and UI tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Prism.xcodeproj -scheme Prism \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath /tmp/playit-derived \
            -clonedSourcePackagesDirPath /tmp/playit-spm \
            CODE_SIGNING_ALLOWED=NO | tee /tmp/playit-build.log
      - name: Run simulator UI tests
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Prism.xcodeproj -scheme Prism \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath /tmp/playit-derived \
            -clonedSourcePackagesDirPath /tmp/playit-spm \
            -parallel-testing-enabled NO \
            -resultBundlePath /tmp/playit-test-results.xcresult \
            CODE_SIGNING_ALLOWED=NO | tee /tmp/playit-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-and-test-results
          path: |
            /tmp/playit-build.log
            /tmp/playit-tests.log
            /tmp/playit-test-results.xcresult
          if-no-files-found: ignore
          retention-days: 7
